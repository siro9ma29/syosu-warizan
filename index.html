}

/* ---------- CALCULATOR ----------
   ヒントボタンのタップで電卓モーダルを開く。
   「いまの けいさん」ボタンで、現在処理中のステップの式を電卓に流し込める。 */

/* 現在のステップで処理している計算式を返す。
   返り値: { display: 表示用文字列(例 "60 ÷ 12"), expr: 電卓に入れる式(例 "60/12") }
   計算対象が無い(おろす/問題なし)場合は null。 */
function getCurrentCalcExpression() {
  const c = state.current;
  if (!c || !c.plan) return null;
  const step = c.plan.steps[c.stepIdx];
  if (!step) return null;
  const stage = c.plan.stageData[step.position];

  if (step.kind === 'tateru') {
    return { display: `${step.partial} ÷ ${c.divisor}`, expr: `${step.partial}/${c.divisor}` };
  }
  if (step.kind === 'kakeru') {
    const tateruStep = c.plan.steps.filter(s => s.kind === 'tateru' && s.position === step.position)[0];
    const q = tateruStep ? tateruStep.value : null;
    if (q === null) return null;
    return { display: `${q} × ${c.divisor}`, expr: `${q}*${c.divisor}` };
  }
  if (step.kind === 'hiku') {
    return { display: `${step.partial} − ${stage.product}`, expr: `${step.partial}-${stage.product}` };
  }
  // orosu: 計算ではないので電卓の自動入力対象外
  return null;
}

/* 電卓の状態と挙動 */
const calc = {
  expr: '',        // 現在入力中の式 (内部表現: / * - + を使用)
  justEvaluated: false,
};

function calcDisplayText() {
  if (calc.expr === '') return '0';
  // 内部記号を見やすい記号に変換して表示
  return calc.expr
    .replace(/\//g, ' ÷ ')
    .replace(/\*/g, ' × ')
    .replace(/-/g, ' − ')
    .replace(/\+/g, ' ＋ ');
}

function renderCalc() {
  const d = document.getElementById('calcDisplay');
  if (d) d.textContent = calcDisplayText();
}

function calcAppendDigit(ch) {
  // 直前に=で計算した直後に数字を押したら、新しい式として開始
  if (calc.justEvaluated) { calc.expr = ''; calc.justEvaluated = false; }
  // 小数点の重複を簡易に防ぐ(現在の数値内に既に . があれば無視)
  if (ch === '.') {
    const lastNum = calc.expr.split(/[+\-*/]/).pop();
    if (lastNum.indexOf('.') !== -1) return;
    if (lastNum === '') calc.expr += '0';
  }
  calc.expr += ch;
  renderCalc();
}

function calcAppendOp(op) {
  if (calc.expr === '') {
    // マイナスのみ先頭許可
    if (op === '-') { calc.expr = '-'; renderCalc(); }
    return;
  }
  calc.justEvaluated = false;
  const last = calc.expr.slice(-1);
  if ('+-*/'.includes(last)) {
    // 直前が演算子なら置き換え
    calc.expr = calc.expr.slice(0, -1) + op;
  } else {
    calc.expr += op;
  }
  renderCalc();
}

function calcClear() {
  calc.expr = '';
  calc.justEvaluated = false;
  renderCalc();
}

function calcBack() {
  if (calc.justEvaluated) { calcClear(); return; }
  calc.expr = calc.expr.slice(0, -1);
  renderCalc();
}

function calcEquals() {
  if (calc.expr === '') return;
  // 末尾が演算子なら除去
  let e = calc.expr;
  while (e.length && '+-*/.'.includes(e.slice(-1))) e = e.slice(0, -1);
  if (e === '') return;
  // 安全な評価: 数字・演算子・小数点・空白のみ許可
  if (!/^[0-9+\-*/.\s]+$/.test(e)) return;
  let result;
  try {
    // eslint-disable-next-line no-new-func
    result = Function('"use strict";return (' + e + ')')();
  } catch (err) { return; }
  if (typeof result !== 'number' || !isFinite(result)) return;
  // 浮動小数点の誤差を丸める(小数第6位まで)
  result = Math.round(result * 1e6) / 1e6;
  calc.expr = String(result);
  calc.justEvaluated = true;
  renderCalc();
}

/* 「いまの けいさん」ボタンの表示を現在ステップに合わせて更新 */
function updateCalcNowButton() {
  const nowBtn = document.getElementById('calcNow');
  if (!nowBtn) return;
  const info = getCurrentCalcExpression();
  if (info) {
    nowBtn.textContent = `いまの けいさん：${info.display}`;
    nowBtn.classList.remove('empty');
    nowBtn.dataset.expr = info.expr;
  } else {
    nowBtn.textContent = 'いまは けいさんの ばめんじゃ ないよ';
    nowBtn.classList.add('empty');
    delete nowBtn.dataset.expr;
  }
}

/* 電卓モーダルを開く */
function openCalcModal() {
  calcClear();
  updateCalcNowButton();
  document.getElementById('calcModal').classList.add('active');
}

function setupCalcModal() {
  const modal = document.getElementById('calcModal');
  if (!modal) return;
  document.getElementById('calcCloseBtn').onclick = () => modal.classList.remove('active');
  modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

  // 「いまの けいさん」ボタン: 現在の式を電卓に流し込む
  document.getElementById('calcNow').onclick = function() {
    const expr = this.dataset.expr;
    if (!expr) return;
    calc.expr = expr;
    calc.justEvaluated = false;
    renderCalc();
  };

  // 数字・小数点
  modal.querySelectorAll('.calc-key[data-d]').forEach(b => {
    b.onclick = () => calcAppendDigit(b.dataset.d);
  });
  // 演算子
  modal.querySelectorAll('.calc-key[data-op]').forEach(b => {
    b.onclick = () => calcAppendOp(b.dataset.op);
  });
  // 機能キー
  modal.querySelectorAll('.calc-key[data-act]').forEach(b => {
    const act = b.dataset.act;
    b.onclick = () => {
      if (act === 'clear') calcClear();
      else if (act === 'back') calcBack();
      else if (act === 'equals') calcEquals();
    };
  });

  renderCalc();
}

/* ---------- HINT MODAL ---------- */
function setupHintModal() {
  const modal = document.getElementById('hintModal');
  const btn = document.getElementById('hintBtn');
  document.getElementById('hintCloseBtn').onclick = () => modal.classList.remove('active');
  modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

  /* 💡ボタンのタップ/長押し処理
     - タップ (短く押す): 計算ヒントON (固定モード4〜5問目で有効)
     - 長押し (500ms以上): 九九表モーダル表示 */
  const LONG_PRESS_MS = 500;
  let pressTimer = null;
  let longPressed = false;

  function startPress(e) {
    e.preventDefault();
    longPressed = false;
    btn.classList.add('pressing');
    pressTimer = setTimeout(() => {
      // 長押し → 九九表表示
      longPressed = true;
      btn.classList.remove('pressing');
      modal.classList.add('active');
      // 触覚フィードバック (対応端末のみ)
      if (navigator.vibrate) navigator.vibrate(30);
    }, LONG_PRESS_MS);
  }
  function endPress(e) {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    btn.classList.remove('pressing');
    if (longPressed) return; // 長押し済みならタップ処理しない
    // タップ処理: 計算ヒントON
    handleHintButtonTap();
  }
  function cancelPress() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    btn.classList.remove('pressing');
    longPressed = true; // タップとして処理されないようにする
  }

  // タッチ/マウス両対応
  btn.addEventListener('touchstart', startPress, { passive: false });
  btn.addEventListener('touchend', endPress);
  btn.addEventListener('touchcancel', cancelPress);
  btn.addEventListener('mousedown', startPress);
  btn.addEventListener('mouseup', endPress);
  btn.addEventListener('mouseleave', cancelPress);
}

/* タップ時の処理: 電卓を開く(+従来の計算ヒント要求も維持) */
function handleHintButtonTap() {
  if (!state.current) return;

  // 電卓モーダルを開く
  openCalcModal();

  // 従来どおり、固定モードの4〜5問目では計算ヒントも有効化する
  const qNum = state.qIdx + 1;
  if (state.mode === 'fixed' && qNum > 3) {
    state.current.hintRequested = true;
    const btn = document.getElementById('hintBtn');
    btn.classList.remove('attention');
    btn.classList.add('active');
    clearIdleTimer();
    if (state.current.stepConfirmed) {
      const step = state.current.plan.steps[state.current.stepIdx];
      if (step) showHintForStep(step);
    }
  }
}

/* ---------- RESULT SCREEN ---------- */
function showResults() {
  showScreen('resultScreen');
  const correct = state.correctCount;
  const total = state.questions.length;
  document.getElementById('resultCorrect').textContent = correct;
  document.getElementById('resultTotal').textContent = total;
  const pct = correct / total;
  let emoji, title, msg;
  if (pct === 1) {
    emoji = '🏆'; title = 'パーフェクト！'; msg = 'すごい！ぜんもん せいかい だよ！';
  } else if (pct >= 0.8) {
    emoji = '🌟'; title = 'よくできました！'; msg = 'もう ちょっとで パーフェクト！';
  } else if (pct >= 0.5) {
    emoji = '😊'; title = 'がんばったね！'; msg = 'この ちょうしで れんしゅう しよう！';
  } else {
    emoji = '💪'; title = 'もう いっかい!'; msg = 'まちがえても だいじょうぶ！れんしゅう が だいじ！';
  }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg;
  if (pct >= 0.8) launchConfetti();
}

function launchConfetti() {
  const container = document.getElementById('confetti');
  container.innerHTML = '';
  const colors = ['#f08a3e', '#4a90c8', '#5a9f6b', '#f5c842', '#e85a4f', '#8a6fb0'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (2 + Math.random() * 2) + 's';
    piece.style.animationDelay = Math.random() * 0.8 + 's';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    if (Math.random() > 0.5) piece.style.borderRadius = '50%';
    container.appendChild(piece);
  }
  setTimeout(() => container.innerHTML = '', 5000);
}

/* ---------- WIRE UP MAIN SCREEN ---------- */
function setupMainScreen() {
  document.querySelectorAll('.num-btn').forEach(btn => {
    btn.onclick = () => handleNumClick(parseInt(btn.dataset.num, 10));
  });
  document.getElementById('skipBtn').onclick = () => {
    if (!state.current) return;
    // 正解マーク表示中(完了済み)は「つぎへ」ボタンを使うのでスキップ無効
    if (state.current.completed) return;
    // スキップした問題は不正解扱い(正解カウントしない)で次の問題へ
    clearIdleTimer();
    const maru = document.getElementById('bigMaru');
    const nextBtn = document.getElementById('nextQBtn');
    maru.style.display = 'none';
    nextBtn.classList.remove('show');
    maru.style.left = ''; maru.style.top = '';
    maru.style.width = ''; maru.style.height = ''; maru.style.inset = '';
    nextBtn.style.top = ''; nextBtn.style.bottom = '';

    state.qIdx++;
    if (state.qIdx >= state.questions.length) {
      showResults();
    } else {
      loadQuestion();
    }
  };
  bindTap(document.getElementById('backBtn'), () => {
    if (confirm('タイトルへ もどりますか？ いまの もんだいは リセットされます。')) {
      const maru = document.getElementById('bigMaru');
      const nextBtn = document.getElementById('nextQBtn');
      maru.style.display = 'none';
      nextBtn.classList.remove('show');
      maru.style.left = ''; maru.style.top = '';
      maru.style.width = ''; maru.style.height = ''; maru.style.inset = '';
      nextBtn.style.top = ''; nextBtn.style.bottom = '';
      clearIdleTimer();
      showScreen('titleScreen');
    }
  });
}

function setupResultScreen() {
  document.getElementById('resultHomeBtn').onclick = () => showScreen('titleScreen');
  document.getElementById('resultRetryBtn').onclick = () => {
    buildQuestionSet();
    showScreen('mainScreen');
    requestAnimationFrame(() => loadQuestion());
  };
}

/* ---------- WINDOW RESIZE ----------
   画面サイズが変わってもひっ算の数字とマス目の整列を保つため、
   現在の表示内容をスナップショット → 再描画 → 復元 を行う */
let resizeTimer = null;
function handleResize() {
  if (!state.current) return;
  const mainActive = document.getElementById('mainScreen').classList.contains('active');
  if (!mainActive) return;
  if (state.current.completed) {
    // 正解表示中は筆算は再描画しないが、マークの位置は画面サイズに合わせて再計算する
    if (document.getElementById('bigMaru').style.display === 'flex') {
      positionCorrectMark();
    }
    return;
  }
  // 小数点移動フェーズ中は、再描画後に状態(点位置・出した桁)を復元して操作を再装着
  const c = state.current;
  // あまりの小数点フェーズ: 計算結果を復元してから、あまりスワイプを再装着
  if (c.phase === 'placeRemainderPoint') {
    const snap = captureDivisionSnapshot();
    renderDivision();
    applyDivisionSnapshot(snap);
    renderDecimalPoints(getCellSize(), c.BR);
    armRemainderSwipe();
    return;
  }
  // あまりの0入力フェーズ: 計算結果と点を復元してスポットを再表示
  if (c.phase === 'inputRemainderZero') {
    const snap = captureDivisionSnapshot();
    renderDivision();
    applyDivisionSnapshot(snap);
    renderDecimalPoints(getCellSize(), c.BR);
    const target = document.getElementById(c._remZeroCellId);
    if (target) target.classList.add('spot');
    return;
  }
  if (c.phase && c.phase !== 'calc' && c.phase !== 'done') {
    renderDivision();
    // すでに点が通過した桁(pad-zero)は表示しておく
    if (c.dividendPt !== null) {
      for (let i = 0; i < c.dividendPt; i++) {
        const d = document.getElementById(`d-${i}`);
        if (d) d.classList.remove('hidden-digit');
      }
    }
    startPhase();   // 現在の点位置からステップ円を再描画
    return;
  }
  // スナップショット → 再描画 → 復元 (計算フェーズ)
  const snap = captureDivisionSnapshot();
  renderDivision();
  applyDivisionSnapshot(snap);
  // 既に出した0の桁を維持
  document.querySelectorAll('#division .pad-zero, #division .extra-zero').forEach(z => {
    // 値が入っている(=既に下ろした/補った)桁は表示
  });
  if (state.current.stepConfirmed) {
    const step = state.current.plan.steps[state.current.stepIdx];
    if (step) {
      spotlightForStep(step);
      showHintForStep(step);
    }
  }
}
window.addEventListener('resize', () => {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(handleResize, 100);
});
window.addEventListener('orientationchange', () => {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(handleResize, 200);
});

/* ---------- INIT ---------- */
window.addEventListener('DOMContentLoaded', () => {
  setupTitleScreen();
  setupMainScreen();
  setupResultScreen();
  buildKukuTable();
  setupHintModal();
  setupCalcModal();
});
</script>
