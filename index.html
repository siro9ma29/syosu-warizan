<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わりざんのひっ算れんしゅう</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap');

  /* ============ DESIGN TOKENS ============ */
  :root {
    --paper:       #fbf8f0;
    --paper-2:     #f5f0e1;
    --ink:         #2c3a4a;
    --ink-soft:    #5a6878;
    --grid:        #9dd4dc;       /* 方眼の線（少し濃いめのターコイズ） */
    --grid-soft:   #cfeaee;
    --line:        #c8d2dc;
    --accent:      #f08a3e;
    --accent-2:    #e85a4f;
    --green:       #5a9f6b;
    --blue:        #4a90c8;
    --purple:      #8a6fb0;
    --yellow:      #f5c842;
    --maru-red:    #e63946;       /* 正解の赤丸 */
    --shadow:      rgba(44, 58, 74, 0.12);
    --shadow-deep: rgba(44, 58, 74, 0.25);

    --font-display: 'Zen Maru Gothic', sans-serif;
    --font-hand:    'Klee One', 'Zen Maru Gothic', cursive;
    --font-ui:      'Kosugi Maru', sans-serif;

    /* 方眼の1マスのサイズ（JSで動的に上書き） */
    --cell: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--paper);
    user-select: none;
  }
  body {
    background-image:
      radial-gradient(circle at 20% 10%, rgba(245, 200, 66, 0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(74, 144, 200, 0.08), transparent 40%);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* ============ SCREENS ============ */
  .screen { position: fixed; inset: 0; display: none; }
  .screen.active { display: flex; }

  /* ============ TITLE SCREEN ============ */
  #titleScreen {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3vh 4vw;
    gap: 2.5vh;
  }
  .title-header { text-align: center; position: relative; }
  .title-header::before {
    content: "✏️"; position: absolute; left: -3em; top: 0.3em;
    font-size: 0.5em; transform: rotate(-15deg);
  }
  .title-header::after {
    content: "📐"; position: absolute; right: -3em; top: 0.3em;
    font-size: 0.5em; transform: rotate(15deg);
  }
  .app-title {
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    color: var(--ink); letter-spacing: 0.08em;
  }
  .app-title .accent { color: var(--accent); }
  .app-subtitle {
    font-family: var(--font-hand);
    font-size: clamp(0.95rem, 1.5vw, 1.2rem);
    color: var(--ink-soft); margin-top: 0.4em;
  }
  .app-version {
    font-family: var(--font-ui);
    font-size: clamp(0.7rem, 1vw, 0.85rem);
    color: var(--ink-soft); opacity: 0.6;
    margin-top: 0.3em; letter-spacing: 0.05em;
  }

  .section-label {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(0.95rem, 1.4vw, 1.15rem);
    color: var(--ink-soft); margin-bottom: 0.8vh;
    text-align: center; letter-spacing: 0.05em;
  }
  .section-label .deco { color: var(--accent); }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 1vw;
    width: 94vw;
    max-width: 1200px;
  }
  .level-card {
    background: white; border: 2px solid var(--line);
    border-radius: 1.2vw; padding: 1.8vh 0.6vw;
    text-align: center; transition: all 0.2s ease;
    box-shadow: 0 4px 0 var(--line);
    min-height: 18vh;
    display: flex; flex-direction: column; justify-content: center; gap: 0.6vh;
  }
  .level-card:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
  .level-card.selected {
    border-color: var(--accent);
    box-shadow: 0 4px 0 var(--accent);
    background: #fff8ef;
  }
  .level-card .lv-num {
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(1.6rem, 2.6vw, 2.3rem);
    color: var(--accent); line-height: 1;
    position: relative;
  }
  .level-card .lv-num small {
    font-size: 0.42em; color: var(--ink-soft);
    display: block; font-weight: 700; margin-bottom: 0.3em;
    letter-spacing: 0.05em;
  }
  /* 派生レベルの小ラベル (例: 0をたてる) */
  .level-card .lv-num .lv-sub {
    display: block;
    font-family: var(--font-display);
    font-size: 0.32em; font-weight: 700;
    color: white; background: var(--purple);
    border-radius: 999px;
    padding: 0.25em 0.6em;
    margin: 0.4em auto 0;
    width: fit-content;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  .level-card .lv-title {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(0.78rem, 1.05vw, 0.95rem); color: var(--ink);
  }
  .level-card .lv-desc {
    font-family: var(--font-hand);
    font-size: clamp(0.65rem, 0.9vw, 0.8rem);
    color: var(--ink-soft); line-height: 1.4;
  }

  /* レベル6の派生(0をたてる)カード: 紫アクセントで「6の仲間」感を出す */
  .level-card.variant .lv-num { color: var(--purple); }
  .level-card.variant.selected {
    border-color: var(--purple);
    box-shadow: 0 4px 0 var(--purple);
    background: #f3eff8;
  }
  /* チャレンジカード: 金色アクセントで特別感を出す */
  .level-card.challenge .lv-num { color: #e0a020; }
  .level-card.challenge {
    background: linear-gradient(160deg, #fffdf5, #fff6e0);
    border-color: var(--yellow);
    box-shadow: 0 4px 0 var(--yellow);
  }
  .level-card.challenge.selected {
    border-color: #e0a020;
    box-shadow: 0 4px 0 #e0a020;
    background: linear-gradient(160deg, #fffaf0, #ffeec0);
  }

  .mode-row {
    display: flex; gap: 2vw;
    align-items: center; justify-content: center;
  }
  .mode-btn {
    background: white; border: 2px solid var(--line);
    border-radius: 1vw; padding: 1.6vh 2.5vw;
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(1rem, 1.4vw, 1.2rem);
    color: var(--ink);
    box-shadow: 0 3px 0 var(--line);
    transition: all 0.15s;
    display: flex; align-items: center; gap: 0.6em;
  }
  .mode-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .mode-btn.selected {
    border-color: var(--blue);
    box-shadow: 0 3px 0 var(--blue);
    background: #eef5fb;
  }
  .mode-btn .icon { font-size: 1.4em; }

  .start-btn {
    background: var(--accent); color: white;
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(1.3rem, 2vw, 1.6rem);
    padding: 1.8vh 5vw; border-radius: 999px;
    box-shadow: 0 5px 0 #c46d2c, 0 10px 20px rgba(240, 138, 62, 0.3);
    transition: all 0.15s; letter-spacing: 0.1em;
  }
  .start-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c46d2c; }
  .start-btn:disabled {
    background: #c8d2dc; box-shadow: 0 5px 0 #a8b2bc; cursor: not-allowed;
  }

  /* ============ MAIN SCREEN ============ */
  #mainScreen {
    flex-direction: column;
    padding: 1.5vh 2vw;
    gap: 1vh;
  }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 1vw; flex-shrink: 0;
  }
  .top-bar .left, .top-bar .right { display: flex; gap: 1vw; align-items: center; }
  .pill {
    background: white; border: 2px solid var(--line);
    border-radius: 999px; padding: 0.6vh 1.2vw;
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(0.85rem, 1.1vw, 1rem);
    color: var(--ink); display: flex; align-items: center; gap: 0.5em;
  }
  .pill .num { color: var(--accent); font-weight: 900; }
  .icon-btn {
    background: white; border: 2px solid var(--line);
    border-radius: 50%;
    width: clamp(40px, 5vh, 56px); height: clamp(40px, 5vh, 56px);
    font-size: clamp(1.1rem, 1.6vw, 1.4rem);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 var(--line); transition: all 0.1s;
  }
  .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  /* ============ ヒントボタン (計算スペース右上) ============ */
  .hint-btn-container {
    position: absolute;
    top: 1.5vh;
    right: 1.5vh;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3vh;
    background: white;
    border: 3px solid var(--yellow);
    border-radius: 1.2vw;
    padding: 1vh 1.4vw;
    box-shadow: 0 4px 0 var(--yellow), 0 6px 16px rgba(245, 200, 66, 0.25);
    cursor: pointer;
    font-family: var(--font-display);
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    /* 「ここにあるよ」と存在感を出すため、常時ふんわり光る */
    animation: hintIdleGlow 2.5s ease-in-out infinite;
  }
  .hint-btn-container:hover {
    transform: translateY(-2px);
  }
  .hint-btn-container:active,
  .hint-btn-container.pressing {
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--yellow);
  }
  .hint-btn-icon {
    font-size: clamp(1.4rem, 3vh, 2rem);
    line-height: 1;
  }
  .hint-btn-label {
    font-size: clamp(0.7rem, 1.2vh, 0.9rem);
    font-weight: 700;
    color: #b8860b;
    letter-spacing: 0.08em;
  }
  /* デフォルトの「ふんわり光る」アニメ */
  @keyframes hintIdleGlow {
    0%, 100% {
      box-shadow: 0 4px 0 var(--yellow), 0 6px 16px rgba(245, 200, 66, 0.25);
    }
    50% {
      box-shadow: 0 4px 0 var(--yellow), 0 6px 24px rgba(245, 200, 66, 0.55);
    }
  }
  /* 計算ヒント有効中の active 状態 */
  .hint-btn-container.active {
    background: var(--green);
    border-color: var(--green);
    box-shadow: 0 4px 0 #468055, 0 6px 16px rgba(90, 159, 107, 0.3);
    animation: none;
  }
  .hint-btn-container.active .hint-btn-label {
    color: white;
  }
  .hint-btn-container.active .hint-btn-icon {
    filter: brightness(1.3);
  }
  /* 「ここを押して」と気づかせる強い点滅 */
  .hint-btn-container.attention {
    animation: hintAttention 0.9s ease-in-out infinite;
    border-color: var(--green);
  }
  @keyframes hintAttention {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 4px 0 var(--green), 0 0 0 0 rgba(90, 159, 107, 0.7);
    }
    50% {
      transform: scale(1.15);
      box-shadow: 0 4px 0 var(--green), 0 0 0 16px rgba(90, 159, 107, 0);
    }
  }
  /* 長押し中の青いリング */
  .hint-btn-container.pressing::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 1.5vw;
    border: 3px solid var(--blue);
    opacity: 0.7;
    pointer-events: none;
    animation: longPressRing 0.5s linear forwards;
  }
  @keyframes longPressRing {
    0%   { transform: scale(0.85); opacity: 0.4; }
    100% { transform: scale(1.25); opacity: 0; }
  }

  /* ============ スキップボタン (控えめ・ヒントボタンの左隣) ============ */
  .skip-btn {
    position: absolute;
    top: 1.5vh;
    /* ヒントボタン(右1.5vh)の左隣に置く。ヒントボタン幅+余白ぶん右から離す */
    right: calc(1.5vh + 90px);
    z-index: 6;
    background: rgba(255, 255, 255, 0.75);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 0.6vh 1.1vw;
    font-family: var(--font-ui);
    font-size: clamp(0.7rem, 1.1vh, 0.85rem);
    color: var(--ink-soft);
    box-shadow: 0 2px 0 var(--line);
    opacity: 0.55;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .skip-btn:hover { opacity: 0.95; }
  .skip-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--line);
    opacity: 1;
  }

  .main-body {
    flex: 1;
    display: grid;
    /* 左(ひっ算)を広く、右(操作)はコンパクトに固定上限を設ける。
       右ブロックが大きくなりすぎてひっ算が狭くなるのを防ぐ */
    grid-template-columns: minmax(0, 1fr) clamp(300px, 34vw, 460px);
    gap: 2vw;
    min-height: 0;
  }

  /* ============ LEFT: CALC PANEL (方眼ノート) ============ */
  .calc-panel {
    background: white;
    border: 2px solid var(--line);
    border-radius: 1.5vw;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 0 var(--line);
  }
  /* 左の赤い縦ライン（ノートっぽさ） */
  .calc-panel::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 8px;
    background: linear-gradient(to bottom, var(--accent-2), var(--accent));
    opacity: 0.6; z-index: 5;
  }

  /* 方眼背景のレイヤー: divisionと座標が完全一致するように、
     JSでoffset(--gx, --gy)をdivisionの位置に合わせる */
  .calc-grid {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    background-position: var(--gx, 0px) var(--gy, 0px);
  }

  /* ひっ算配置エリア（絶対座標、JSで位置調整） */
  .division {
    position: absolute;
    /* topとleftはJSでマス単位に合わせて設定 */
    z-index: 2;
    /* 親(.calc-grid)が pointer-events:none のため、ここで明示的に有効化して
       マス・小数点コマのタッチ/クリックを受け取れるようにする */
    pointer-events: auto;
  }

  /* セル（方眼の1マス） */
  .cell {
    position: absolute;
    width: var(--cell);
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-hand);
    font-weight: 600;
    font-size: calc(var(--cell) * 0.7);
    color: var(--ink);
    transition: background 0.25s ease, box-shadow 0.25s ease;
    line-height: 1;
  }
  .cell.spot {
    background: rgba(245, 200, 66, 0.4);
    border-radius: 6px;
    box-shadow: 0 0 0 2px rgba(245, 200, 66, 0.7);
  }
  /* ヒント: 計算ソースとなる数字を緑のパルスで強調 */
  .cell.hint-source,
  .divisor-cell.hint-source {
    color: var(--green) !important;
    animation: hintPulse 1.4s ease-in-out infinite !important;
    border-radius: 6px;
    z-index: 3;
  }
  @keyframes hintPulse {
    0%, 100% {
      background: rgba(90, 159, 107, 0.15);
      box-shadow: 0 0 0 2px rgba(90, 159, 107, 0.4);
      transform: scale(1);
    }
    50% {
      background: rgba(90, 159, 107, 0.35);
      box-shadow: 0 0 0 4px rgba(90, 159, 107, 0.7);
      transform: scale(1.08);
    }
  }
  /* 演算記号ヒント (÷ × -) */
  .op-hint {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: calc(var(--cell) * 0.5);
    color: var(--green);
    pointer-events: none;
    z-index: 4;
    background: white;
    border: 2px solid var(--green);
    border-radius: 50%;
    width: calc(var(--cell) * 0.55);
    height: calc(var(--cell) * 0.55);
    box-shadow: 0 2px 8px rgba(90, 159, 107, 0.35);
    animation: opHintIn 0.35s ease-out, opHintBounce 1.4s ease-in-out 0.35s infinite;
  }
  @keyframes opHintIn {
    0%   { transform: scale(0) rotate(-90deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg);   opacity: 1; }
  }
  @keyframes opHintBounce {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }
  .cell.error {
    animation: shake 0.5s, flashRed 0.6s 3;
    color: var(--accent-2);
  }
  .cell.correct-pop {
    animation: pop 0.4s;
    color: var(--green);
  }
  .cell.fade-in {
    animation: fadeIn 0.3s;
  }
  .cell.drop-anim {
    animation: dropDown 0.6s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  /* 中間計算の0を薄く表示 (例: 648÷2 で 6-6=0 のとき) */
  .cell.faded {
    color: var(--line);
    opacity: 0.5;
  }
  /* わる数の余分な先頭0(例: 0.8→08.)を薄く表示 */
  .divisor-cell.faded {
    color: var(--line);
    opacity: 0.45;
  }
  /* leadingZeroモードの商の先頭0: 薄く表示(入力直後)。fadedより少し見えるグレーに */
  .cell.lead-zero {
    color: var(--ink-soft);
    opacity: 0.55;
    position: relative;
  }
  /* 問題完了時: 斜線を引いて「消した」ことを示す */
  .cell.lead-zero.struck::after {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    top: 50%;
    height: 3px;
    background: var(--accent-2);
    border-radius: 3px;
    transform: rotate(-25deg);
    transform-origin: center;
    animation: strikeIn 0.35s ease-out forwards;
  }
  @keyframes strikeIn {
    0%   { transform: rotate(-25deg) scaleX(0); opacity: 0; }
    100% { transform: rotate(-25deg) scaleX(1); opacity: 1; }
  }
  /* 薄字(faded)の0は計算ソースとして扱わない (例: 「09÷3」と誤読されるのを防ぐ)
     hint-sourceクラスが付いても、fadedの見た目を優先する */
  .cell.faded.hint-source {
    color: var(--line) !important;
    opacity: 0.5 !important;
    animation: none !important;
    background: transparent !important;
    box-shadow: none !important;
  }

  /* divisor（わる数）+ ブラケット記号 */
  .divisor-cell {
    /* 数字部分 */
    position: absolute;
    width: var(--cell);
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-hand);
    font-weight: 600;
    font-size: calc(var(--cell) * 0.7);
    color: var(--ink);
    line-height: 1;
  }

  /* ÷の役を果たすブラケット ")" の縦線 */
  .bracket-line {
    position: absolute;
    width: 3px;
    background: var(--ink);
    border-radius: 3px;
  }
  /* 上線（商の下、わられる数の上） */
  .top-bar-line {
    position: absolute;
    height: 3px;
    background: var(--ink);
    border-radius: 3px;
  }
  /* かけ算の結果の下の線 */
  .sub-line {
    position: absolute;
    height: 3px;
    background: var(--ink);
    border-radius: 3px;
  }

  /* ============ 小数のわり算 用 ============ */
  /* 小数点マーカー */
  .dec-point {
    position: absolute;
    border-radius: 50%;
    background: var(--ink);
    z-index: 5;
  }
  /* 操作中(=いま動かす)の小数点は赤で強調 */
  .dec-point.active-pt {
    background: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(232, 90, 79, 0.25);
  }
  /* 操作対象でない小数点は黒 */
  .dec-point.inactive-pt { background: var(--ink); box-shadow: none; }
  /* 商の小数点(確定): 黒。これ以上の操作が無いことを示す */
  .dec-point.quotient-pt { background: var(--ink); box-shadow: none; }
  .dec-point.pop-in { animation: ptPop 0.45s cubic-bezier(0.34, 1.4, 0.64, 1); }
  /* スワイプで下から上がってくる演出 */
  .dec-point.rise-in { animation: ptRise 0.4s ease-out; }
  @keyframes ptRise {
    0%   { transform: translateY(60px) scale(1.3); opacity: 0.4; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes ptPop {
    0% { transform: scale(0); }
    60% { transform: scale(1.6); }
    100% { transform: scale(1); }
  }

  /* 「元の小数点を探す」点線赤丸 */
  .find-circle {
    position: absolute;
    border-radius: 50%;
    border: 2px dashed var(--accent-2);
    background: rgba(232, 90, 79, 0.10);
    z-index: 7;
    cursor: pointer;
    animation: stepPulse 1.1s ease-in-out infinite;
  }
  .find-circle.wrong-flash { animation: shake 0.5s; background: rgba(232,90,79,0.3); }

  /* 商の小数点を打つ スワイプ用ハンドル/ガイド */
  .swipe-handle {
    position: absolute;
    border-radius: 50%;
    background: rgba(232, 90, 79, 0.18);
    border: 2px solid var(--accent-2);
    z-index: 9;
    cursor: grab;
    touch-action: none;
  }
  .swipe-handle:active { cursor: grabbing; }

  /* 小数点を右へ動かす 横スワイプ用ハンドル/ガイド */
  .hswipe-handle {
    position: absolute;
    border-radius: 50%;
    background: rgba(232, 90, 79, 0.18);
    border: 2px solid var(--accent-2);
    z-index: 9;
    cursor: grab;
    touch-action: none;
  }
  .hswipe-handle:active { cursor: grabbing; }
  .hswipe-ghost {
    position: absolute;
    color: var(--accent-2);
    opacity: 0.45;
    font-weight: 900;
    z-index: 6;
    pointer-events: none;
    animation: ghostSlide 1.2s ease-in-out infinite;
  }
  @keyframes ghostSlide {
    0%, 100% { transform: translateX(0); opacity: 0.3; }
    50%      { transform: translateX(6px); opacity: 0.6; }
  }
  .swipe-ghost {
    position: absolute;
    color: var(--accent-2);
    opacity: 0.45;
    font-weight: 900;
    z-index: 6;
    pointer-events: none;
    animation: ghostBob 1.2s ease-in-out infinite;
  }
  @keyframes ghostBob {
    0%, 100% { transform: translateY(0); opacity: 0.3; }
    50%      { transform: translateY(-6px); opacity: 0.6; }
  }

  /* 「お皿矢印」(点を右下へ動かす弧の矢印) */
  .move-arrow {
    position: absolute;
    color: var(--accent-2);
    font-weight: 900;
    z-index: 6;
    pointer-events: none;
    animation: arrowFly 1.1s ease-out forwards;
    text-shadow: 0 2px 4px rgba(232, 90, 79, 0.3);
  }
  @keyframes arrowFly {
    0%   { transform: translate(-6px, -6px) scale(0.6); opacity: 0; }
    30%  { opacity: 1; }
    70%  { transform: translate(0, 0) scale(1.15); opacity: 1; }
    100% { transform: translate(0, 0) scale(1); opacity: 0; }
  }

  /* さわれる数字(小数点移動の対象)を強調 */
  .cell.touchable, .divisor-cell.touchable {
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 0 0 3px rgba(74, 144, 200, 0.55);
    background: rgba(74, 144, 200, 0.14);
    animation: touchPulse 1.2s ease-in-out infinite;
  }
  @keyframes touchPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(74, 144, 200, 0.5); }
    50%      { box-shadow: 0 0 0 6px rgba(74, 144, 200, 0.18); }
  }

  /* 0補充・割り進みの0で、まだ出していない桁は隠す */
  .cell.hidden-digit { opacity: 0; pointer-events: none; }
  .cell.pop-in { animation: digitPop 0.5s cubic-bezier(0.34, 1.4, 0.64, 1); }
  @keyframes digitPop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.25); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  /* 補った0は少しだけ控えめな色にして「もとからは無かった」ことを示す */
  .cell.pad-zero:not(.hidden-digit),
  .cell.extra-zero:not(.hidden-digit) { color: var(--blue); }

  /* 商の小数点コマ(ドラッグ用) */
  .point-piece {
    position: absolute;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 3px 8px rgba(232, 90, 79, 0.45), 0 0 0 4px rgba(232, 90, 79, 0.18);
    z-index: 8;
    cursor: grab;
    touch-action: none;
    animation: piecePulse 1.1s ease-in-out infinite;
  }
  @keyframes piecePulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }
  .point-piece.shake-err { animation: shake 0.5s; background: var(--accent-2); }
  .point-piece.grabbing { cursor: grabbing; animation: none; transform: scale(1.25); }

  /* 商マスの小数点スロット(タップ候補) */
  .point-slot {
    position: absolute;
    border-radius: 50%;
    border: 2px dashed rgba(74, 144, 200, 0.55);
    background: rgba(74, 144, 200, 0.08);
    z-index: 7;
    cursor: pointer;
  }
  .point-slot:active { background: rgba(74, 144, 200, 0.25); }

  /* 小数点の移動ステップ円(数字の右下に出る点線円) */
  .step-circle {
    position: absolute;
    border-radius: 50%;
    border: 2px dashed rgba(74, 144, 200, 0.5);
    background: transparent;
    z-index: 7;
  }
  /* 次に押すべき円だけを目立たせてタッチ可能に */
  .step-circle.active {
    border-color: var(--accent-2);
    background: rgba(232, 90, 79, 0.12);
    cursor: pointer;
    pointer-events: auto;
    animation: stepPulse 1.1s ease-in-out infinite;
  }
  .step-circle:not(.active) { pointer-events: none; opacity: 0.5; }
  @keyframes stepPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232, 90, 79, 0.5); transform: scale(1); }
    50%      { box-shadow: 0 0 0 6px rgba(232, 90, 79, 0); transform: scale(1.12); }
  }


  /* あまり表示タグ */
  .remainder-tag {
    position: absolute;
    display: flex; align-items: center; gap: 0.4em;
    font-family: var(--font-hand);
    font-size: calc(var(--cell) * 0.4);
    color: var(--ink-soft); white-space: nowrap;
    z-index: 3;
  }
  .remainder-tag .label {
    background: var(--paper-2); padding: 0.2em 0.5em;
    border-radius: 6px;
  }
  .remainder-tag .value {
    color: var(--accent); font-weight: 700;
    min-width: 1.2em; text-align: center;
  }

  /* ============ 大きな赤丸（正解マーク） ============ */
  .big-maru {
    position: absolute;
    /* 位置・サイズは JS(positionCorrectMark)で筆算を避けて動的に設定する。
       下記はフォールバック値 */
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
    gap: 1vh;
  }
  .big-maru .maru-svg-wrap {
    /* サイズは JS で配置領域に合わせて上書きする。下記はフォールバック */
    width: 40vh;
    max-width: 90%;
    height: 40vh;
    max-height: 90%;
    animation: maruDraw 0.6s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
  }
  .big-maru svg {
    width: 100%;
    height: 100%;
  }
  .big-maru circle {
    fill: none;
    stroke: var(--maru-red);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 1200;
    stroke-dashoffset: 1200;
    animation: maruStroke 0.7s ease-out forwards;
    filter: drop-shadow(0 4px 8px rgba(230, 57, 70, 0.3));
  }
  @keyframes maruDraw {
    0%   { transform: scale(0.3) rotate(-30deg); opacity: 0; }
    60%  { transform: scale(1.1) rotate(5deg);  opacity: 1; }
    100% { transform: scale(1)   rotate(0deg);   opacity: 1; }
  }
  @keyframes maruStroke {
    to { stroke-dashoffset: 0; }
  }
  .big-maru .seikai-text {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(1.5rem, 4.5vh, 2.6rem);
    color: var(--maru-red);
    background: white;
    padding: 0.4em 1.2em;
    border-radius: 999px;
    border: 3px solid var(--maru-red);
    box-shadow: 0 6px 0 #b32530, 0 10px 25px rgba(230, 57, 70, 0.3);
    letter-spacing: 0.15em;
    opacity: 0;
    animation: textPop 0.4s 0.6s forwards;
  }
  @keyframes textPop {
    0%   { transform: translateY(20px) scale(0.5); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* ============ ANIMATIONS ============ */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  @keyframes flashRed {
    0%, 100% { background: transparent; }
    50% { background: rgba(232, 90, 79, 0.3); border-radius: 8px; }
  }
  @keyframes pop {
    0%   { transform: scale(0.5); opacity: 0; }
    60%  { transform: scale(1.2); }
    100% { transform: scale(1);   opacity: 1; }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dropDown {
    0%   { transform: translateY(calc(var(--cell) * -3)); opacity: 0; }
    60%  { transform: translateY(calc(var(--cell) * 0.2)); opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }

  /* ============ RIGHT: CONTROLS ============ */
  .controls {
    display: flex; flex-direction: column;
    gap: 2vh; min-height: 0;
  }
  /* フェーズ案内パネル(小数点を動かす手順の案内) */
  .phase-guide-panel {
    background: linear-gradient(160deg, #fffdf5, #fff6e6);
    border: 2px solid var(--yellow);
    border-radius: 1.5vw; padding: 2vh 1.5vw;
    box-shadow: 0 4px 0 var(--yellow);
    min-height: 9vh;
    display: flex; align-items: center; justify-content: center;
  }
  .phase-guide {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(1rem, 1.5vw, 1.35rem);
    color: var(--ink); text-align: center; line-height: 1.6;
  }
  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.5vh;
  }
  .panel-title {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(0.95rem, 1.2vw, 1.1rem); color: var(--ink);
  }
  .step-hint {
    font-family: var(--font-hand);
    font-size: clamp(0.7rem, 0.9vw, 0.85rem); color: var(--ink-soft);
  }
  @keyframes pulse {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .numpad-panel {
    background: white; border: 2px solid var(--line);
    border-radius: 1.5vw; padding: 2vh 1.5vw;
    box-shadow: 0 4px 0 var(--line);
    flex: 1; display: flex; flex-direction: column;
    min-height: 0;
  }
  .numpad-panel.disabled .num-btn {
    opacity: 0.35; cursor: not-allowed; pointer-events: none;
  }
  .numpad-panel.disabled { background: #f8f5ed; }
  .numpad-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    /* 行の高さに上限を設け、縦に間延びさせない */
    grid-template-rows: repeat(2, minmax(0, 15vh));
    gap: 0.8vw;
    min-height: 0;
    align-content: center;
  }
  .num-btn {
    background: white; border: 3px solid var(--line);
    border-radius: 1vw;
    font-family: var(--font-hand); font-weight: 600;
    font-size: clamp(1.8rem, 4vh, 2.8rem);
    color: var(--ink);
    box-shadow: 0 4px 0 var(--line);
    transition: all 0.08s;
    display: flex; align-items: center; justify-content: center;
  }
  .numpad-panel:not(.disabled) .num-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--accent);
    background: #fff8ef;
  }
  .num-btn.wrong {
    animation: shake 0.5s;
    background: #fde8e6;
    border-color: var(--accent-2);
    color: var(--accent-2);
  }

  /* ============ NEXT BUTTON (大きな次へ) ============ */
  .next-q-btn {
    position: absolute;
    bottom: 4vh;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: white;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(1.2rem, 2.2vh, 1.6rem);
    padding: 1.8vh 4vw;
    border-radius: 999px;
    box-shadow: 0 5px 0 #c46d2c, 0 10px 25px rgba(240, 138, 62, 0.4);
    z-index: 20;
    letter-spacing: 0.08em;
    display: none;
    animation: nextBtnIn 0.5s 0.8s both;
  }
  .next-q-btn:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 2px 0 #c46d2c; }
  .next-q-btn.show { display: block; }
  @keyframes nextBtnIn {
    from { transform: translateX(-50%) translateY(40px); opacity: 0; }
    to { transform: translateX(-50%) translateY(0); opacity: 1; }
  }

  /* ============ MODAL ============ */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(44, 58, 74, 0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(3px);
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
  .modal {
    background: var(--paper); border-radius: 2vw;
    padding: 3vh 3vw;
    max-width: 92vw; max-height: 92vh;
    box-shadow: 0 20px 60px var(--shadow-deep);
    position: relative; animation: pop 0.3s;
  }
  .modal-close {
    position: absolute; top: -1vh; right: -1vh;
    width: 5vh; height: 5vh;
    background: var(--accent-2); color: white;
    border-radius: 50%; font-size: 2.5vh; font-weight: 900;
    box-shadow: 0 4px 12px var(--shadow);
  }
  .modal-title {
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(1.4rem, 2.5vh, 2rem);
    text-align: center; color: var(--ink); margin-bottom: 2vh;
  }
  .modal-title .deco { color: var(--accent); }
  /* モーダル下部の使い方説明 */
  .modal-hint-note {
    margin-top: 2vh;
    text-align: center;
    font-family: var(--font-hand);
    font-size: clamp(0.75rem, 1.4vh, 0.95rem);
    color: var(--ink-soft);
    background: var(--paper-2);
    padding: 1vh 2vw;
    border-radius: 999px;
    border: 1px dashed var(--line);
  }
  .kuku-table {
    display: grid;
    grid-template-columns: auto repeat(9, 1fr);
    gap: 2px; background: var(--ink);
    border-radius: 1vw; overflow: hidden; padding: 2px;
  }
  .kuku-cell {
    background: white; padding: 0.6vh 0.4vw;
    text-align: center; font-family: var(--font-hand);
    font-size: clamp(0.85rem, 1.4vh, 1.1rem);
    color: var(--ink); font-weight: 600;
  }
  .kuku-header {
    background: var(--accent); color: white;
    font-family: var(--font-display); font-weight: 900;
  }
  .kuku-row-header {
    background: var(--blue); color: white;
    font-family: var(--font-display); font-weight: 900;
  }

  /* ============ CALCULATOR MODAL ============ */
  .calc-modal { width: min(92vw, 360px); }
  /* いま計算している式の案内ボタン */
  .calc-now {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(0.95rem, 2vh, 1.2rem);
    color: var(--ink);
    background: #eef5fb;
    border: 2px solid var(--blue);
    border-radius: 999px;
    padding: 1vh 2vw;
    text-align: center;
    margin-bottom: 1.6vh;
    box-shadow: 0 3px 0 var(--blue);
    transition: all 0.15s;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .calc-now:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--blue); }
  .calc-now.empty {
    background: var(--paper-2);
    border-color: var(--line);
    box-shadow: 0 3px 0 var(--line);
    color: var(--ink-soft);
    cursor: default;
  }
  .calc-now.empty:active { transform: none; box-shadow: 0 3px 0 var(--line); }
  /* 電卓の表示画面 */
  .calc-display {
    background: var(--ink);
    color: #eafff0;
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(1.8rem, 4.5vh, 2.8rem);
    text-align: right;
    padding: 1.4vh 3vw;
    border-radius: 1.5vw;
    margin-bottom: 1.6vh;
    min-height: 1.4em;
    overflow-x: auto;
    white-space: nowrap;
    letter-spacing: 0.02em;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
  }
  /* ボタングリッド */
  .calc-keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(6px, 1.2vh, 12px);
  }
  .calc-key {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(1.2rem, 3vh, 1.7rem);
    color: var(--ink);
    background: white;
    border: 2px solid var(--line);
    border-radius: 1.2vw;
    padding: 1.4vh 0;
    box-shadow: 0 3px 0 var(--line);
    transition: all 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .calc-key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .calc-op {
    color: white; background: var(--blue);
    border-color: var(--blue); box-shadow: 0 3px 0 #3a72a0;
  }
  .calc-op:active { box-shadow: 0 1px 0 #3a72a0; }
  .calc-fn {
    color: white; background: var(--ink-soft);
    border-color: var(--ink-soft); box-shadow: 0 3px 0 #45525f;
  }
  .calc-fn:active { box-shadow: 0 1px 0 #45525f; }
  .calc-eq {
    color: white; background: var(--accent);
    border-color: var(--accent); box-shadow: 0 3px 0 #c46d2c;
    grid-row: span 2;
  }
  .calc-eq:active { box-shadow: 0 1px 0 #c46d2c; }
  .calc-zero { grid-column: span 2; }

  /* ============ CHALLENGE METHOD MODAL ============ */
  .method-modal { max-width: 640px; text-align: center; }
  .method-q {
    font-family: var(--font-hand);
    font-size: clamp(1rem, 2.2vh, 1.3rem);
    color: var(--ink); line-height: 1.7;
    margin-bottom: 2vh;
  }
  .method-example {
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center;
    gap: 0.6em;
    font-family: var(--font-hand);
    font-size: clamp(0.8rem, 1.6vh, 1rem);
    background: white;
    border: 2px dashed var(--line);
    border-radius: 1vw;
    padding: 1.4vh 2vw;
    margin-bottom: 2.5vh;
  }
  .method-example-label {
    background: var(--accent); color: white;
    font-family: var(--font-display); font-weight: 900;
    border-radius: 999px; padding: 0.2em 0.8em;
    font-size: 0.85em;
  }
  .method-example-yes { color: var(--purple); font-weight: 700; }
  .method-example-no  { color: var(--blue);   font-weight: 700; }
  .method-example-vs  { color: var(--ink-soft); }
  .method-btn-row {
    display: flex; gap: 3vw;
    align-items: stretch; justify-content: center;
  }
  .method-btn {
    flex: 1; max-width: 220px;
    background: white; border: 3px solid var(--line);
    border-radius: 1.4vw; padding: 2.4vh 1vw;
    display: flex; flex-direction: column;
    align-items: center; gap: 0.6vh;
    box-shadow: 0 5px 0 var(--line);
    transition: all 0.15s;
    font-family: var(--font-display);
  }
  .method-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
  .method-btn .method-btn-icon { font-size: clamp(1.8rem, 4vh, 2.6rem); line-height: 1; }
  .method-btn .method-btn-label {
    font-weight: 900; font-size: clamp(1.1rem, 2.4vh, 1.5rem);
    letter-spacing: 0.08em;
  }
  .method-btn .method-btn-sub {
    font-family: var(--font-hand);
    font-size: clamp(0.7rem, 1.4vh, 0.9rem);
    color: var(--ink-soft);
  }
  .method-btn.yes { color: var(--purple); }
  .method-btn.yes:hover { border-color: var(--purple); box-shadow: 0 5px 0 var(--purple); background: #f3eff8; }
  .method-btn.no { color: var(--blue); }
  .method-btn.no:hover { border-color: var(--blue); box-shadow: 0 5px 0 var(--blue); background: #eef5fb; }

  @media (max-width: 599px) {
    .method-modal { max-width: 94vw; }
    .method-btn-row { gap: 4vw; }
    .method-btn { padding: 2vh 2vw; border-radius: 3vw; }
  }

  /* ============ RESULT SCREEN ============ */
  #resultScreen {
    flex-direction: column;
    align-items: center; justify-content: center;
    padding: 4vh 4vw; gap: 3vh;
  }
  .result-card {
    background: white; border-radius: 2vw;
    padding: 5vh 8vw;
    box-shadow: 0 8px 0 var(--line), 0 20px 40px var(--shadow);
    text-align: center; border: 3px solid var(--accent);
    position: relative;
  }
  .result-emoji {
    font-size: clamp(4rem, 12vh, 7rem);
    line-height: 1; margin-bottom: 2vh;
    animation: bounce 1.5s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  .result-title {
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(2rem, 4vh, 3rem);
    color: var(--ink); margin-bottom: 1vh;
  }
  .result-score {
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(2.5rem, 6vh, 4rem);
    color: var(--accent); margin: 2vh 0;
  }
  .result-score small { font-size: 0.5em; color: var(--ink-soft); }
  .result-msg {
    font-family: var(--font-hand);
    font-size: clamp(1rem, 1.8vh, 1.3rem);
    color: var(--ink-soft); margin-bottom: 3vh;
  }
  .result-buttons {
    display: flex; gap: 2vw; justify-content: center;
  }
  .result-btn {
    background: white; border: 3px solid var(--line);
    color: var(--ink); font-family: var(--font-display);
